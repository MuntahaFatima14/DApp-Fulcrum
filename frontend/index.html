<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto-Caffeine</title>
    
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<script>
    async function connectWallet() {
        if (window.ethereum) {
            const provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []); // Triggers MetaMask
            window.location.href = "creator.html"; 
        } else {
            alert("Please install MetaMask!");
        }
    }
</script>
    
    <style>
        :root {
            --bg-main: #E2D1A4;       
            --bg-header: #C1A87D;     
            --text-black: #1A1A1A;    
            --text-brown: #5E3D21;    
            --btn-bg: #593C1F;        
            --border-line: #BBA77B;   
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Header --- */
        header {
            background-color: var(--bg-header);
            padding: 14px 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 5px solid #51361A;
            background-color: #fff;
            object-fit: cover;
        }

        .logo-name {
            color: #51361A;
            font-size: 1.25rem;
            font-weight: 800;
        }

        .connect-btn {
            background-color: var(--btn-bg);
            color: #E2D1A4;
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 800;
            cursor: pointer;
        }

        /* --- Main Content --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-top: 100px;
        }

        .badge {
            border: 1px solid #51361A;
            padding: 5px 15px;
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: 800;
            margin-bottom: 110px;
            color: #51361A;
        }

        h1 {
            font-size: 3.4rem;
            font-weight: 900;
            line-height: 1.05;
            color: var(--text-black);
            max-width: 800px;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        h1 span {
            color: var(--text-brown);
        }

        .description {
            font-size: 0.95rem;
            font-weight: 900;
            color: #000;
            max-width: 580px;
            line-height: 1.3;
            margin-bottom: 65px;
        }

        .actions {
            display: flex;
            gap: 24px;
        }

        .btn-main {
            background-color: var(--btn-bg);
            color: #fff;
            border: none;
            padding: 18px 35px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            min-width: 220px;
        }

        /* --- Footer --- */
        footer {
            padding: 0 45px 40px;
        }

        .line {
            border-top: 1.5px solid var(--border-line);
            margin-bottom: 12px;
        }

        .copy {
            font-size: 0.65rem;
            font-weight: 800;
            color: #51361A;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="logo-box">
                <img src="coffee.jfif" alt="Logo" class="logo-img">
                <div class="logo-name">Crypto-Caffeine</div>
            </div>
        </div>

        <button class="connect-btn" onclick="connectWallet()">Connect Wallet</button>
    </header>

    <main>
        <div class="badge">DECENTRALIZED MICRO-DONATIONS</div>
        
        <h1>Direct Support For <span>Independent Voices.</span></h1>
        
        <p class="description">
            A decentralized protocol for micro-donations. No middlemen, no fees, total autonomy for journalists.
        </p>

        <div class="actions">
            <button class="btn-main" onclick="location.href='creator.html'">
            Get started as a Creator</button>

            <button class="btn-main" onclick="location.href='widget.html'">
            Explore Directory</button>
        </div>
    </main>

    <footer>
        <div class="line"></div>
        <div class="copy">© 2026 Crypto-Caffeine</div>
    </footer>

</body>
</html>
