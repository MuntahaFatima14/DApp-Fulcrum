<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Support Author</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/index.umd.min.js"></script>
    <script type="module" src="scripts/widget-logic.js"></script>
    
</head>
<body>
    <header class="shared-header">
        <div class="header-left-group">
            <button class="back-btn-circle" onclick="history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="shared-logo-circle"><img src="coffee.jfif" alt="Logo"></div>
            <div class="shared-brand-name">Crypto-Caffeine</div>
        </div>
        <nav class="shared-navbar">
            <a href="/index.html" class="shared-nav-link">Home</a>
            <a href="creatosjournal.html" class="shared-nav-link">Creators</a>
            <a href="globalcreators.html" class="shared-nav-link">Global Dashboard</a>
        </nav>
    </header>
    <main style="padding: 80px 20px; display:flex; flex-direction:column; align-items:center;">
        <h2 style="font-size:1.5rem; font-weight:800; margin-bottom:40px;">Support the Author </h2>
        <div style="background-color:var(--card-bg); border-radius:25px; width:100%; max-width:500px; padding:50px 60px; display:flex; flex-direction:column; gap:20px;">
            <div style="display:flex; flex-direction:column; gap:8px;">
                <label style="font-size:0.65rem; font-weight:800;">Name </label>
                <input type="text" placeholder="e.g Satoshi Nakamoto" style="background-color:var(--input-fill); border:none; border-radius:8px; padding:14px; font-weight:700; color:var(--logo-border);">
            </div>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <label style="font-size:0.65rem; font-weight:800;">Message</label>
                <input type="text" placeholder="e.g Good Job!!!!!" style="background-color:var(--input-fill); border:none; border-radius:8px; padding:14px; font-weight:700; color:var(--logo-border);">
            </div>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <label style="font-size:0.65rem; font-weight:800;">Account Address </label>
                <input type="text" placeholder="e.g 0x8F537B0...aha6c556" style="background-color:var(--input-fill); border:none; border-radius:8px; padding:14px; font-weight:700; color:var(--logo-border);">
            </div>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <label style="font-size:0.65rem; font-weight:800;">Amount (ETH) </label>
                <input type="text" placeholder="e.g 1.24" style="background-color:var(--input-fill); border:none; border-radius:8px; padding:14px; font-weight:700; color:var(--logo-border);">
            </div>
            <button style="background-color:var(--btn-bg); color:#fff; border:none; border-radius:15px; padding:18px; font-size:0.8rem; font-weight:800; cursor:pointer; margin-top:15px;">Send ETH</button>
        </div>
    </main>
    <footer class="shared-footer"><div class="shared-footer-line"></div><p class="shared-copyright">© 2026 Crypto-Caffeine</p></footer>
</body>
</html>
