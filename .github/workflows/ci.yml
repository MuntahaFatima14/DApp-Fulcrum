name: Crypto-Caffeine CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      # Even if using CDNs, this ensures your local dev environment 
      # is reproducible if you ever add local packages.
      run: |
        if [ -f package.json ]; then
          npm install
        else
          echo "No package.json found, skipping npm install."
        fi

    - name: Validate File Structure
      # Ensures you didn't accidentally delete or move critical files
      run: |
        test -f index.html || (echo "index.html missing" && exit 1)
        test -d abi || (echo "abi folder missing" && exit 1)

    - name: Syntax Check (Linting)
      # This checks for basic JS syntax errors in your logic files
      run: |
        npx eslint scripts/*.js --fix || echo "No ESLint config found, skipping lint."

    - name: Security Scan
      # Scans for hardcoded private keys or secrets in your scripts
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
