<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Crypto-Caffeine - Deploy</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/index.umd.min.js"></script>
    <script type="module" src="deploy-logic.js"></script>
    
    
</head>
<body>
    <header class="shared-header">
        <div class="header-left-group">
            <button class="back-btn-circle" onclick="history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="shared-logo-circle"><img src="coffee.jfif" alt="Logo"></div>
            <div class="shared-brand-name">Crypto-Caffeine</div>
        </div>
        <nav class="shared-navbar">
            <a href="index.html" class="shared-nav-link">Home</a>
            <a href="creatosjournal.html" class="shared-nav-link">Creators</a>
            <a href="globalcreators.html" class="shared-nav-link">Global Dashboard</a>
        </nav>
    </header>
    <main style="flex:1; display:flex; justify-content:center; align-items:center;">
        <div style="background-color: var(--card-bg); border-radius: 24px; width: 100%; max-width: 450px; padding: 55px 40px; display: flex; flex-direction: column; gap: 18px;">
            <h2 style="font-size:1.5rem; font-weight:800;">Deploy Your Protocol</h2>
            <p style="font-size:0.8rem; font-weight:700; margin-top:-10px;">Initialize your immutable Tip Jar instance.</p>
            <label style="font-size:0.7rem; font-weight:700; margin-bottom:-10px;">Publication Name</label>
            <input type="text" placeholder="e.g. The Global Report" style="background-color:var(--input-fill); border:none; border-radius:10px; padding:14px; font-weight:700; color:var(--logo-border);">
            <div style="background-color:var(--input-fill); border-radius:18px; padding:24px 20px; font-size:0.85rem; font-weight:900; line-height:1.3;">Note: This will execute the createTipJar function on the Factory Contract.</div>
            <button style="background-color:var(--btn-bg); color:#FFFFFF; border:none; border-radius:15px; padding:18px; font-size:0.85rem; font-weight:800; cursor:pointer;" onclick="window.location.href='dashboard.html'">Initialize Instance</button>
        </div>
    </main>
    
    <footer class="shared-footer"><div class="shared-footer-line"></div><p class="shared-copyright">© 2026 Crypto-Caffeine</p></footer>
</body>
</html>
